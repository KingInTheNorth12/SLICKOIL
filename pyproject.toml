[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oilspill-tracer"
version = "0.1.0"
description = "Modular research pipeline contracts for oil-spill detection and tracing"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rasterio>=1.4,<2",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "xarray>=2025.1,<2027",
  "h5netcdf>=1.8,<2",
  "Pillow>=11,<13",
]

[project.scripts]
oilspill = "oilspill.cli:main"

[project.optional-dependencies]
ml-yolo = ["ultralytics>=8.3,<9"]
ml-dense = ["torch>=2.6,<3", "segmentation-models-pytorch>=0.5,<0.6"]
# SegFormer uses SMP with native configurable SAR channels, no Transformers dependency.
ml-segformer = ["torch>=2.6,<3", "segmentation-models-pytorch>=0.5,<0.6"]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oilspill"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["oilspill"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "shapely", "shapely.*"]
ignore_missing_imports = true
